# Builds «Курьер: Сестрорецк»: tests, downloads the town from OpenStreetMap (Overpass API),
# builds the site and, on main, publishes it to GitHub Pages.
name: Courier game

on:
  push:
    branches: [main, 'claude/**']
    paths: ['courier-game/**', '.github/workflows/courier-game.yml']
  pull_request:
    paths: ['courier-game/**', '.github/workflows/courier-game.yml']
  workflow_dispatch:
    inputs:
      refresh_map:
        description: 'Скачать карту из OpenStreetMap заново (игнорировать кэш)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: courier-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: courier-game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: courier-game/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Raw Overpass tiles are cached for a month: fewer requests to the free OSM servers. The cache
      # is saved even when the download fails, so the next run only fetches the missing tiles.
      - id: osm
        run: |
          echo "prefix=osm-${{ hashFiles('courier-game/map.config.json', 'courier-game/src/osm/overpass.ts') }}-$(date -u +%Y-%m)-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.refresh_map }}
        with:
          path: courier-game/data-raw
          key: ${{ steps.osm.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.osm.outputs.prefix }}

      - name: Build the Sestroretsk map from OpenStreetMap
        timeout-minutes: 45
        run: npm run map -- ${{ inputs.refresh_map && '--refresh' || '' }}

      - uses: actions/cache/save@v4
        if: ${{ always() && hashFiles('courier-game/data-raw/*.json') != '' }}
        with:
          path: courier-game/data-raw
          key: ${{ steps.osm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: courier-game/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
